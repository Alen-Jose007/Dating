<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hangout</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #dcdcdc;
        font-family: "Patrick Hand", cursive;
      }

      .paper {
        width: 300px;
        height: 400px;
        background: repeating-linear-gradient(white, white 28px, #dfefff 29px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        padding: 25px;
        border-radius: 8px;
        position: relative;
        transform: rotate(-4deg);
      }

      h2 {
        text-align: center;
        margin-top: 20px;
        font-size: 24px;
      }

      .heart {
        position: absolute;
        color: #ff6b81;
        font-size: 22px;
      }

      .top-left {
        top: 10px;
        left: 15px;
      }
      .right {
        right: 20px;
        top: 120px;
      }

      .options {
        margin-top: 50px;
        position: relative;
        height: 150px;
      }

      .option {
        display: flex;
        align-items: center;
        cursor: pointer;
        font-size: 20px;
        position: absolute;
      }

      .box {
        width: 20px;
        height: 20px;
        border: 2px solid black;
        margin-right: 10px;
      }

      #yesOption {
        left: 20px;
        top: 20px;
      }

      #noOption {
        left: 20px;
        top: 70px;
      }

      .face {
        position: absolute;
        bottom: 10px;
        left: 15px;
        font-size: 22px;
      }

      .result {
        text-align: center;
        font-size: 24px;
        margin-top: 130px;
        color: #e91e63;
      }
    </style>
  </head>

  <body>
    <div class="paper" id="paper">
      <div class="heart top-left">💖</div>
      <div class="heart right">💗</div>

      <h2>Can we hang out soon? 💖</h2>

      <div class="options">
        <div class="option" id="yesOption">
          <div class="box"></div>
          yes
        </div>

        <div class="option" id="noOption">
          <div class="box"></div>
          no
        </div>
      </div>

      <div class="face">😊</div>
    </div>

    <script>
      const no = document.getElementById("noOption");
      const yes = document.getElementById("yesOption");
      const paper = document.getElementById("paper");

      let canMove = true;

      // Stop movement after 5 seconds
      setTimeout(() => {
        canMove = false;
      }, 5000);

      // Move NO on hover (only while allowed)
      no.addEventListener("mouseover", () => {
        if (!canMove) return;

        const maxX = 200;
        const maxY = 120;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        no.style.left = x + "px";
        no.style.top = y + "px";
      });

      // YES result
      function showYes() {
        paper.innerHTML =
          "<div class='result'>Yay! 💖 Let's hang out soon 🥰</div>";
      }

      // Clicks
      yes.addEventListener("click", showYes);
      no.addEventListener("click", showYes);
    </script>
  </body>
</html>
